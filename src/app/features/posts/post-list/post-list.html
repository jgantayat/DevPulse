<div class="page-container">
  <h2>Posts</h2>

  @if (posts$ | async; as posts) {
    @for (post of posts; track post.id) {
      <div class="post-card">
        <h3>{{ post.title }}</h3>
        <p>{{ post.body }}</p>
        <small>User ID: {{ post.userId }}</small>
      </div>
    } @empty {
      <p>No posts available.</p>
    }
  } @else {
    <p>Loading posts...</p>
  }
</div>
