<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="mb-0">Posts</h2>
  <button class="btn btn-primary" (click)="openCreatForm()">
    <i class="bi bi-plus-lg me-1"></i> New Post
  </button>
</div>

@if (deleteError) {
  <div class="alert alert-danger alert-dismissible mb-4" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ deleteError }}
  </div>
}

@if (showForm) {
  <div class="card bg-light border-0 shadow-sm mb-4">
    <div class="card-body">
      <app-post-form [editPost]="editingPost" (saved)="onFormSaved()" (cancelled)="showForm = false">
      </app-post-form>
    </div>
  </div>
}

@if (posts$ | async; as posts) {
  @if (posts.length === 0) {
    <p class="text-muted fst-italic">No posts yet.</p>
  }
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    @for (post of posts; track post.id) {
      <div class="col">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">{{ post.title }}</h5>
            <p class="card-text text-muted">{{ post.body }}</p>
          </div>
          <div class="card-footer bg-transparent d-flex gap-2 justify-content-end">
            <button class="btn btn-outline-primary btn-sm" (click)="openEditForm(post)">
              <i class="bi bi-pencil me-1"></i>Edit
            </button>
            <button class="btn btn-outline-danger btn-sm" (click)="onFormCancelled(post.id)">
              <i class="bi bi-trash me-1"></i>Delete
            </button>
          </div>
        </div>
      </div>
    } @empty {
      <p class="text-muted fst-italic">No posts available.</p>
    }
  </div>
} @else {
  <div class="d-flex justify-content-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
}
